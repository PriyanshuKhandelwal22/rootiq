name: CI
on: [push, pull_request]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest psutil fastapi uvicorn
      - name: Import check
        run: python -c "import rootiq.service, rootiq.api, rootiq.rca.rules, rootiq.rca.benchmark"
      - name: Benchmark regression check
        run: python scripts/check_benchmark.py